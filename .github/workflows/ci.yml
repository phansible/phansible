name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write # codecov upload via OIDC, no token secret needed

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          coverage: pcov

      - uses: ramsey/composer-install@v3

      - name: phpcs
        run: bin/phpcs -n

      - name: phpstan
        run: composer analyse -- --no-progress

      - name: phpunit
        run: bin/phpunit --coverage-clover coverage.clover

      - uses: codecov/codecov-action@v5
        with:
          files: coverage.clover
          use_oidc: true

  signed-commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check every commit is signed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          unsigned=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits" \
            -q '.[] | select(.commit.verification.verified | not) | "\(.sha[0:7]) \(.commit.message | split("\n")[0])"')
          if [ -n "$unsigned" ]; then
            echo "$unsigned"
            echo "::error::Unsigned commits. Sign them and force-push: https://docs.github.com/en/authentication/managing-commit-signature-verification/signing-commits"
            exit 1
          fi
