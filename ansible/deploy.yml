---
- hosts: webservers
  user: "{{ system_user }}"
  vars_prompt:
    - name: deploy_version
      default: main
      prompt: "Tag, Branch or Hash to deploy"
      private: no
  tasks:
    - name: Set Maintenance Page
      shell: cp {{ doc_root }}/maintenance/maintenance.html {{ doc_root }}/maintenance.html
      ignore_errors: true

    - name: Checkout code
      git: repo=https://github.com/phansible/phansible.git dest={{ project_root }} accept_hostkey=true version={{ deploy_version }}

    # The app role clones the generator roles into the checkout, so it has to run after it
    - name: Fetch generator roles
      include_role: name=app
      tags: [ 'app' ]

    # --no-scripts: there is no bin/console for the cache:clear auto-script
    - name: Run Composer
      shell: /usr/local/bin/composer install --no-dev --no-progress --no-scripts --classmap-authoritative chdir={{ project_root }}

    # symfony/dotenv is a dev dependency, so prod reads its env from .env.local.php
    - name: Write env file
      template:
        src: env.local.php.j2
        dest: "{{ project_root }}/.env.local.php"
        mode: '0640'
        force: no
      vars:
        app_secret: "{{ lookup('password', '/dev/null chars=hexdigits length=32') }}"

    - name: Read ACLs for web_user
      shell: 'setfacl -Rn -m u:"{{ webserver_user }}":rX -m d:u:"{{ webserver_user }}":rX {{ project_root }}'

    - name: Read and Write ACLs for shell user
      shell: 'setfacl -Rn -m u:"{{ system_user }}":rwX -m d:u:"{{ system_user }}":rwX {{ project_root }}'

    - name: Clean cache directory
      file: path={{ project_root }}/var/cache/prod state=absent

    - name: Make sure var directory exists
      file: path={{ project_root }}/var state=directory owner={{ system_user }} group={{ system_group }}

    - name: Read and Write ACLs var dir
      # no -n: the mask has to be recalculated to rwx or www-data stays read-only
      shell: 'setfacl -R -m u:"{{ webserver_user }}":rwX -m d:u:"{{ webserver_user }}":rwX {{ project_root }}/var'

    - name: Remove maintenance page
      file: path="{{ doc_root }}/maintenance.html" state=absent
