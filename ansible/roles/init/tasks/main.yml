---
- name: Install System Packages
  become: yes
  apt:
    pkg: [curl, ca-certificates, acl, git, unzip]
    state: latest
    update_cache: yes

- name: Add Sury PHP repository
  become: yes
  deb822_repository:
    name: php
    uris: https://packages.sury.org/php/
    suites: '{{ ansible_facts.distribution_release }}'
    components: main
    signed_by: https://packages.sury.org/php/apt.gpg

- name: Install Extra Packages
  become: yes
  apt:
    pkg: '{{ sys_packages }}'
    state: latest
    update_cache: yes

- name: Create system user
  become: yes
  user:
    name: '{{ system_user }}'
    shell: /bin/bash

- name: Authorise root's SSH keys for system user
  become: yes
  copy:
    src: /root/.ssh/authorized_keys
    dest: '/home/{{ system_user }}/.ssh/'
    remote_src: yes
    owner: '{{ system_user }}'
    group: '{{ system_group }}'
    mode: '0600'
    directory_mode: '0700'

- name: Create project root
  become: yes
  file:
    path: '{{ project_root }}'
    state: directory
    owner: '{{ system_user }}'
    group: '{{ system_group }}'

- name: Install unattended-upgrades
  become: yes
  apt:
    pkg: unattended-upgrades
    state: latest

- name: Enable daily unattended upgrades
  become: yes
  copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: '0644'

# PHP security releases ship from sury, which Debian's default origins don't cover
- name: Allow unattended upgrades from Sury
  become: yes
  copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-sury
    content: |
      Unattended-Upgrade::Origins-Pattern {
              "origin=deb.sury.org,codename=${distro_codename}";
      };
    mode: '0644'
